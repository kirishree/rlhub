<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Blocked</title>
    <style>
      /* Reset */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #1e366c, #243b55);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .card {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border-radius: 1rem;
        padding: 2rem 3rem;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        max-width: 500px;
        width: 90%;
      }

      .logo {
        max-width: 200px;
        margin: 0 auto 1rem;
        display: block;
      }

      .icon {
        font-size: 3rem;
        margin-bottom: 1rem;
        color: #ff4c4c;
      }

      h1 {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 1rem;
        opacity: 0.8;
      }

      .small {
        margin-top: 1.5rem;
        font-size: 0.9rem;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- Logo at the top -->
      <img class="logo" src="./logo.png" alt="Company Logo" />

      <div class="icon">🚫</div>
      <h1>Website Blocked</h1>
      <p>Access to this website has been restricted by your administrator.</p>
    </div>
  </body>
</html>
