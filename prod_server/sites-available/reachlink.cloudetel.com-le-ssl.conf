<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin webmaster@localhost
    ServerName reachlink.cloudetel.com
    ServerAlias www.reachlink.cloudetel.com
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    # Zabbix  
    ProxyPass /zabbix http://127.0.0.1/zabbix
    ProxyPassReverse /zabbix http://127.0.0.1/zabbix
#    <Directory "/var/www/">
#             AllowOverride All
#    </Directory>
    # Django Backend API
    ProxyPass /beapi http://127.0.0.1:5000/beapi
    ProxyPassReverse /beapi http://127.0.0.1:5000/beapi    
 #   <Directory "/etc/reach/reachlink">
 #            AllowOverride All
 #   </Directory>
    # React Frontend (only for root path "/")
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

SSLCertificateFile /etc/letsencrypt/live/reachlink.cloudetel.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/reachlink.cloudetel.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>

<VirtualHost 10.8.0.1:80>
    ServerName blocked.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/blocked-error.log
    CustomLog ${APACHE_LOG_DIR}/blocked-access.log combined
</VirtualHost>



</IfModule>
